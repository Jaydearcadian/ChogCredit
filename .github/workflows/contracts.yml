name: contracts

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml", ".gitmodules"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml", ".gitmodules"]

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - run: forge --version
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
